version: '3.8'

services:
  db:
    image: postgres:15
    container_name: adminpro-db
    environment:
      POSTGRES_USER: adminpro
      POSTGRES_PASSWORD: adminpro_password
      POSTGRES_DB: adminpro_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
